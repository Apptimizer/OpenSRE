[project]
name = "opensre-slack-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "slack-bolt>=1.23.0",
  "aiohttp>=3.14.4",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
