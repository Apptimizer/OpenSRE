# Build images and the Helm chart from this fork into ghcr.io/apptimizer.
#
# Runs on pushes to the `apptimizer` and `applift` branches (and manually). Every
# artifact is keyed by the branch and commit it was built from:
#   images: ghcr.io/apptimizer/opensre-<svc>:<appVersion>-<shortsha>
#   chart:  oci://ghcr.io/apptimizer/charts/opensre:<version>-<branch>.g<shortsha>
#
# The upstream docker-publish.yml (Docker Hub, v* tags) is left untouched.
# Packages stay private; consumers pull with a ghcr read token.

name: Publish to ghcr (apptimizer, applift)

on:
  push:
    branches: [apptimizer, applift]
    paths:
      - "charts/opensre/**"
      - "config_service/**"
      - "sre-agent/**"
      - "web_ui/**"
      - "slack-bot/**"
      - ".github/workflows/ghcr-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: apptimizer

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.meta.outputs.short }}
      app_version: ${{ steps.meta.outputs.app_version }}
      chart_version: ${{ steps.meta.outputs.chart_version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          short="$(git rev-parse --short=7 HEAD)"
          app="$(awk -F'"' '/^appVersion:/ {print $2}' charts/opensre/Chart.yaml)"
          ver="$(awk '/^version:/ {print $2}' charts/opensre/Chart.yaml)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "app_version=${app}-${short}" >> "$GITHUB_OUTPUT"
          # The g prefix keeps the prerelease identifier alphanumeric (semver).
          echo "chart_version=${ver}-${GITHUB_REF_NAME}.g${short}" >> "$GITHUB_OUTPUT"

  images:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: config_service
            image: opensre-config-service
          - context: sre-agent
            image: opensre-sre-agent
          - context: web_ui
            image: opensre-web-ui
          - context: slack-bot
            image: opensre-slack-bot
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            OPENSRE_VERSION=${{ needs.meta.outputs.app_version }}
            OPENSRE_GIT_SHA=${{ needs.meta.outputs.short }}
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ needs.meta.outputs.app_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          echo "- \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ needs.meta.outputs.app_version }}\` → \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  chart:
    needs: [meta, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.1

      - name: Package
        run: |
          helm repo add neo4j https://helm.neo4j.com/neo4j
          helm dependency build charts/opensre
          helm package charts/opensre \
            --version "${{ needs.meta.outputs.chart_version }}" \
            --app-version "${{ needs.meta.outputs.app_version }}" \
            --destination dist

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          helm push dist/opensre-${{ needs.meta.outputs.chart_version }}.tgz "oci://${REGISTRY}/${NAMESPACE}/charts"
          echo "- chart \`oci://${REGISTRY}/${NAMESPACE}/charts/opensre:${{ needs.meta.outputs.chart_version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # The host cluster tracks k8s-vcluster-devops main. Rewrite the image
  # digests and the chart revision there so ArgoCD rolls. Only applift:
  # a feature-branch publish must not become production.
  gitops:
    needs: [meta, images, chart]
    if: github.ref == 'refs/heads/applift'
    runs-on: ubuntu-latest
    steps:
      - name: Require the gitops token
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "Secret GITOPS_TOKEN is empty."
            echo "Add a fine-grained PAT with contents:write on Apptimizer/k8s-vcluster-devops as Actions secret GITOPS_TOKEN."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v4
        with:
          repository: Apptimizer/k8s-vcluster-devops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Pin images and chart
        env:
          APP_VERSION: ${{ needs.meta.outputs.app_version }}
          CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
        run: |
          python3 << 'PY'
          import os, re, subprocess
          from pathlib import Path

          app = os.environ["APP_VERSION"]
          chart = os.environ["CHART_VERSION"]
          images = {
              Path("infrastructure/opensre/platform/values.yaml"): [
                  "opensre-config-service",
                  "opensre-sre-agent",
                  "opensre-web-ui",
              ],
              Path("infrastructure/opensre/secrets/manifests/07-slack-bot.yaml"): [
                  "opensre-slack-bot",
              ],
          }

          def digest_for(name: str) -> str:
              out = subprocess.check_output(
                  [
                      "docker", "buildx", "imagetools", "inspect",
                      f"ghcr.io/apptimizer/{name}:{app}",
                  ],
                  text=True,
              )
              for line in out.splitlines():
                  if line.startswith("Digest:"):
                      digest = line.split()[1]
                      if re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                          return digest
              raise SystemExit(f"no digest for {name}:\n{out}")

          refs = {
              name: f"ghcr.io/apptimizer/{name}:{app}@{digest_for(name)}"
              for names in images.values()
              for name in names
          }
          for path, names in images.items():
              text = path.read_text()
              for name in names:
                  text, n = re.subn(
                      rf"ghcr\.io/apptimizer/{re.escape(name)}:\S+",
                      refs[name],
                      text,
                  )
                  if n != 1:
                      raise SystemExit(f"{path}: expected 1 pin for {name}, found {n}")
              path.write_text(text)

          app_path = Path("infrastructure/opensre/secrets/manifests/06-platform-application.yaml")
          text, n = re.subn(
              r"targetRevision: 1\.2\.8-applift\.g[0-9a-f]+",
              f"targetRevision: {chart}",
              app_path.read_text(),
              count=1,
          )
          if n != 1:
              raise SystemExit(f"chart targetRevision matches: {n}")
          app_path.write_text(text)
          PY

      - name: Commit and push
        env:
          APP_VERSION: ${{ needs.meta.outputs.app_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            infrastructure/opensre/platform/values.yaml \
            infrastructure/opensre/secrets/manifests/06-platform-application.yaml \
            infrastructure/opensre/secrets/manifests/07-slack-bot.yaml
          if git diff --cached --quiet; then
            echo "Pins already match ${APP_VERSION}"
            exit 0
          fi
          git commit -m "Pin OpenSRE to ${APP_VERSION}."
          git push origin HEAD:main
